# =============================================================================
# Example AI-ready metadata package(s) - Whole Genome Sequencing
# Bridge2AI Genomic Information Standards (GIST) - companion implementation
#
# Accompanies the manuscript's autism genome-sequencing use case (two sequencing centers, B1
# and B2). The synthetic-data notice is the machine-readable `_disclaimer` field
# below (kept in-data so it survives serialization to JSON).
#
# Field-level ontology anchoring follows the manuscript's Supplementary Table 1
# where it fixes a term; a representative subset of those MUST fields is populated
# here and the COMPLETE set is enumerated in
# ../../templates/genomic_metadata_package_template.yaml.
#
# Design note (partial confounding). The use case is a PARTIAL confound: both
# centers run mostly blood with a saliva subgroup whose proportion DIFFERS between
# centers, B1 is all 2-channel while B2 mixes 2- and 4-channel, and only the
# alignment/variant-calling pipeline is center-specific (BWA-MEM/GATK at B1,
# DRAGMAP/DRAGEN at B2). The five packages spread specimen across both centers and
# chemistry across B2 (4-channel shown on blood, so chemistry is not aliased with
# specimen); `cohort_context` records the center-level proportions that make the
# metadata-aware model identifiable. Genetic-ancestry values are assigned
# arbitrarily and are unrelated to site; in the source effort ancestry varies
# within each center.
# =============================================================================

_disclaimer: >-
  ILLUSTRATIVE / SYNTHETIC. Example metadata for the Bridge2AI GIST implementation
  resources (arXiv:2512.11519). No values derive from human subjects; subject ids,
  site identities, accessions, checksums, container digests, dates, coverage and
  variant counts, QC metrics, ancestry, and phenotype values are fabricated
  placeholders and site identities are generalized (B1, B2). The only
  non-synthetic identifiers, marked inline, are the GA4GH Refget seqcol digest and
  the ontology and tool-registry (bio.tools) CURIEs. Ancestry values are assigned arbitrarily and are unrelated
  to site.

prefixes:                                   # CURIE -> base IRI (expansion = base + local id)
  UBERON: "http://purl.obolibrary.org/obo/UBERON_"
  OBI:    "http://purl.obolibrary.org/obo/OBI_"
  NCIT:   "http://purl.obolibrary.org/obo/NCIT_"
  MONDO:  "http://purl.obolibrary.org/obo/MONDO_"
  EFO:    "http://www.ebi.ac.uk/efo/EFO_"    # NOTE: EFO does NOT use the OBO PURL base
  GSSO:   "http://purl.obolibrary.org/obo/GSSO_"
  LOINC:  "https://loinc.org/"
  ORCID:  "https://orcid.org/"
# GIST-*-EX package ids are GIST-local and non-resolving; ga4gh: is the GA4GH VRS
# namespace (computed, content-derived identifiers with no central resolver).

# Study-wide MUST fields (constant across the packages below).
study_context:
  contact_email: "<data-contact email>"                          # main-text MUST
  analyses_performed: "germline SNV/indel calling"               # per FairGenomes AnalysesPerformed
  algorithms: [ "bwa-mem 0.7.17 | dragmap 1.3.0", "gatk-haplotypecaller 4.4.0.0 | dragen 4.2.4" ]
  random_seed: "<pipeline RNG seed>"                             # paper MUST (reproducibility)

# Center-level context: the proportions that carry the statistical identifiability.
cohort_context:
  centers:
    B1:
      specimen_fractions:  { blood: 0.88, saliva: 0.12 }
      chemistry_fractions: { "2-channel": 1.00, "4-channel": 0.00 }
      pipeline: { aligner: "bwa-mem", variant_caller: "gatk-haplotypecaller" }
    B2:
      specimen_fractions:  { blood: 0.72, saliva: 0.28 }   # saliva share differs from B1 (0.12) - the lever
      chemistry_fractions: { "2-channel": 0.62, "4-channel": 0.38 }   # B2's mix; B1 has none
      pipeline: { aligner: "dragmap", variant_caller: "dragen" }

# Reusable reference block (order-sensitive seqcol; see identifiers/refget-seqcol.md).
_reference_grch38: &ref
  label: "GRCh38 primary assembly, UCSC naming, 25 sequences in seqcol order: chr1-chr22, chrM, chrX, chrY"
  seqcol_digest: "Ba88PY52_qeifhJrgUXyin6UITdXNsg3"   # REAL GA4GH seqcol top-level digest (resolvable). Order is part of what the digest commits to.
  seqcol_comparison: "GET /comparison/{d1}/{d2} -> array_elements.a_and_b_same_order"   # how a consumer checks two references
  source_uri: "<URI of the exact reference FASTA used>"    # Table 3 MUST: pointer to source file
  source_checksum: "md5:<fasta-md5>"
  # An assembly accession is deliberately omitted: GCF_000001405.40 is GRCh38.p14
  # (patches + alt loci, RefSeq accessions), not this 25-sequence UCSC primary set;
  # the seqcol digest is the authority.

metadata_packages:

  # -- B1-0001: B1, blood, 2-channel (NovaSeq 6000), BWA-MEM/GATK -------------
  - package_id: "GIST-GS-EX:B1-0001"
    schema_version: "0.1.0"
    study: { bioproject: "<BioProject accession>", assay: "whole genome sequencing", assay_id: "OBI:0002117" }
    subject:
      subject_id: "B1-0001"
      key_clinical_diagnosis: { label: "autism spectrum disorder", id: "MONDO:0005258" }   # field per NCIT:C15607
      sex_assigned_at_birth: "male"                # per GSSO:009418 (assigned gender at birth)
      pathological_state: "affected"               # per FairGenomes PathologicalState
    sample:
      sample_id: "B1-0001"
      biosample: "<BioSample accession>"
      specimen_type: { label: "blood", id: "UBERON:0000178" }
      biospecimen_type: "whole blood"              # per NCIT:C70713 (biospecimen type)
      analyte: { label: "genomic DNA", id: "EFO:0008479" }
      collection_method: { label: "blood specimen collection", id: "OBI:1110095" }
      sampling_protocol: "<protocol id / URI>"     # per EFO:0005518
      collection_site: "B1"                        # generalized center id
    sequencing:
      platform: "Illumina"
      instrument_model: "Illumina NovaSeq 6000"    # SRA/ENA INSTRUMENT_MODEL CV
      sbs_chemistry_channels: 2                     # 2 = NovaSeq/NextSeq; 4 = HiSeq family
      library_source: "GENOMIC"                     # SRA CV
      library_strategy: "WGS"                       # SRA CV
      library_selection: "RANDOM"                   # SRA CV
      library_construction: "PCR-free"              # free text (NOT an SRA CV field)
      library_preparation: "<library kit>"         # per FairGenomes NGSKits
      unique_molecular_identifiers: false           # per EFO:0010199
      sequencing_method: "WGS"                      # per FairGenomes SequencingMethods
      library_layout: "PAIRED"
      read_length_bp: 150
      target_mean_coverage_x: 30
      sequencing_date: "2023-05-14"                 # main-text MUST
    reference_assembly: *ref
    processing:
      alignment:       { tool: "bwa-mem", tool_id: "biotools:bwa", version: "0.7.17", container: "sha256:<digest>", parameters: "-M -K 100000000" }
      variant_calling: { tool: "gatk-haplotypecaller", tool_id: "biotools:gatk", version: "4.4.0.0", container: "sha256:<digest>", parameters: "--ploidy 2 -ERC GVCF" }
      read_mapping_quality: "MAPQ>=20 retained"
      workflow:        { engine: "nextflow", version: "24.04.0", run_id: "<uuid>", commit_sha: "<git sha>", provenance: "../../provenance/gs_align_call_run.provenance.yaml" }
    sequence_data:                                  # Table 2 MUST storage formats
      fastq: [ { file: "B1-0001_R1.fastq.gz", checksum: "sha256:<digest>" }, { file: "B1-0001_R2.fastq.gz", checksum: "sha256:<digest>" } ]
      cram:  { file: "B1-0001.cram", checksum: "sha256:<digest>", reference_seqcol: "Ba88PY52_qeifhJrgUXyin6UITdXNsg3" }   # CRAM pins its reference
      reference_fasta: { file: "<GRCh38.fa>", checksum: "md5:<fasta-md5>" }   # FASTA MUST
      feature_annotation: { file: "<annotation.gff3.gz>", format: "GFF3", checksum: "sha256:<digest>" }   # GFF MUST
    variant_callset:
      file: "B1-0001.g.vcf.gz"                      # gVCF (Table 2 MUST)
      vcf_version: "4.3"                            # gVCF min 4.2; 4.3 used
      checksum: "sha256:<digest>"
      normalization: "fully-justified (GA4GH VRS)"  # VRS uses fully-justified normalization, NOT left-alignment
      variant_count: 4820000
      snv_count: 4180000
      indel_count: 640000                           # BWA-MEM/GATK arm (~6.5:1 SNV:indel)
      inferred_sex_karyotype: "XY"                  # per FairGenomes GenotypicSex (from the callset)
      variant_representation:                       # GA4GH VRS - Table 6 MUST (one illustrative allele)
        - vrs_id: "<ga4gh:VA.* - compute with vrs-python against the seqcol-pinned reference>"
          hgvs_g: "<GRCh38 g. HGVS expression>"
          variant_quality: 812.3                    # QUAL
          total_depth: 42                           # DP
          ref_supporting_reads: 21                  # AD[0]
          alt_supporting_reads: 21                  # AD[1]
      reference_stamps: { gnomad: "v4.1", clinvar: "2026-01-06", dbnsfp: "4.7a" }
    genetic_ancestry:
      method: "PCA projection onto 1000 Genomes reference"   # ancestry field per NCIT:C176763
      superpop_fractions: { AFR: 0.03, AMR: 0.05, EAS: 0.02, EUR: 0.88, SAS: 0.02 }   # arbitrary, unrelated to site
      top_pcs: [ -0.011, 0.004, 0.021 ]
    qc:
      mean_coverage_x: 31.4                          # mosdepth
      callable_fraction_ge10x_nonN: 0.962            # denominator is non-N reference bases
      contamination_freemix: 0.005                   # VerifyBamID2 = within-species (human-human) contamination
      human_read_fraction: 0.992                     # non-host DNA low for blood
      duplicate_rate: 0.081                          # patterned NovaSeq flow cell (ExAmp)
      ti_tv: 2.01
      sex_concordance: "concordant"                  # phenotype.reported_sex vs variant_callset.inferred_sex_karyotype
    phenotype:
      phenopacket: "<path to GA4GH Phenopacket v2 for this subject>"
      phenotypes_ref: "NCIT:C16977"                  # phenotypes field per Supp Table 1
      diseases:
        - term: { label: "autism spectrum disorder", id: "MONDO:0005258" }
      reported_sex: { label: "Male", id: "NCIT:C20197" }   # self-reported/clinical sex
      measure_count: 27
      example_measurements:
        - assay: { label: "ADOS-2 calibrated severity score", id: "<LOINC CURIE>" }
          value: { quantity: { value: 7, unit: { label: "Score", id: "NCIT:C25338" } } }
    provenance:
      generated_by: { orcid: "https://orcid.org/0000-0000-0000-0000", role: "pipeline operator" }   # deliberately checksum-invalid: never a real iD
      generated_at: "2026-01-15T04:22:10Z"           # processing time (may post-date sequencing)
      reference_manifest_digest: "sha256:<lock-digest>"
      pipeline_commit_sha: "<git sha>"
      prov_record: "../../provenance/gs_align_call_run.provenance.yaml"   # W3C PROV (this record is B1-0001's run)
    analysis_covariates:
      { site: "B1", specimen_type: "blood", sbs_chemistry_channels: 2, aligner: "bwa-mem",
        variant_caller: "gatk-haplotypecaller", mean_coverage_x: 31.4, contamination_freemix: 0.005,
        human_read_fraction: 0.992, ancestry_pc: [ -0.011, 0.004, 0.021 ] }


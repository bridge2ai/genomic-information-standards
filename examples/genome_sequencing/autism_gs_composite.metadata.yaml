      vcf_version: "4.3"
      checksum: "sha256:<digest>"
      normalization: "fully-justified (GA4GH VRS)"
      variant_count: 4818000
      snv_count: 4180000
      indel_count: 638000                           # BWA-MEM/GATK arm
      inferred_sex_karyotype: "XX"

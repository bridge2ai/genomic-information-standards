      sequencing_date: "2023-06-02"
    reference_assembly: *ref
    processing:
      alignment:       { tool: "bwa-mem", tool_id: "biotools:bwa", version: "0.7.17", container: "sha256:<digest>", parameters: "-M -K 100000000" }
      variant_calling: { tool: "gatk-haplotypecaller", tool_id: "biotools:gatk", version: "4.4.0.0", container: "sha256:<digest>", parameters: "--ploidy 2 -ERC GVCF" }
      read_mapping_quality: "MAPQ>=20 retained"
      workflow:        { engine: "nextflow", version: "24.04.0", run_id: "<uuid>", commit_sha: "<git sha>", provenance: "<path to this sample's W3C PROV record (same shape as ../../provenance/)>" }
    sequence_data:
      fastq: [ { file: "B1-0002_R1.fastq.gz", checksum: "sha256:<digest>" }, { file: "B1-0002_R2.fastq.gz", checksum: "sha256:<digest>" } ]
      cram:  { file: "B1-0002.cram", checksum: "sha256:<digest>", reference_seqcol: "Ba88PY52_qeifhJrgUXyin6UITdXNsg3" }

# Reading the design: specimen (blood/saliva) appears in BOTH centers; B2 carries
# both 2- and 4-channel with 4-channel on BLOOD (chemistry separable from specimen);
# pipeline is center-specific (as in the paper). The counts track the right causes:
# the DRAGEN arms (all of B2) run higher indel counts than the GATK arms (caller
# effect), and B2-0002 adds a further 4-channel chemistry increment - both recorded;
# SNV and indel counts track genetic ancestry (the AFR-majority arm, B2-0001, carries the
# most, ~+20% SNVs / ~+15% indels vs EUR). human_read_fraction drops for saliva (specimen). FREEMIX stays low
# throughout (human-human, unaffected by microbial DNA). cohort_context records the
# differing saliva/chemistry proportions that let a metadata-aware model separate
# these from biological signal.
# -----------------------------------------------------------------------------

# =============================================================================
# Reusable AI-ready genomic metadata package TEMPLATE (WGS / WES / panel)
# Bridge2AI Genomic Information Standards (GIST)
#
# Fill every <...>; delete blocks that do not apply to your assay. Prefer
# persistent identifiers / CURIEs over free text (see ../vocabularies/resources.md).
# Field-level ontology anchoring follows the manuscript's Supplementary Table 1;
# each such field carries its reference in a trailing comment. Worked instances
# are in ../examples/.
# =============================================================================
_disclaimer: >-
  TEMPLATE (no data). A blank metadata package for the Bridge2AI GIST
  implementation resources (arXiv:2512.11519). All values are <placeholders>.

prefixes:                                   # CURIE -> base IRI (expansion = base + local id)
  UBERON: "http://purl.obolibrary.org/obo/UBERON_"
  OBI:    "http://purl.obolibrary.org/obo/OBI_"
  NCIT:   "http://purl.obolibrary.org/obo/NCIT_"
  MONDO:  "http://purl.obolibrary.org/obo/MONDO_"
  HP:     "http://purl.obolibrary.org/obo/HP_"
  EFO:    "http://www.ebi.ac.uk/efo/EFO_"    # NOTE: EFO does NOT use the OBO PURL base
  GSSO:   "http://purl.obolibrary.org/obo/GSSO_"
  LOINC:  "https://loinc.org/"
  HGNC:   "https://bioregistry.io/hgnc:"
  ORCID:  "https://orcid.org/"

metadata_package:
  package_id: "<namespace:sample-id>"
  schema_version: "<x.y.z>"
  study:
    bioproject: "<BioProject accession | ->"
    assay: "<whole genome sequencing | whole exome sequencing | targeted panel>"
    assay_id: "<OBI:0002117 WGS | OBI:0002118 WES | NCIT:C173599 panel>"
    contact_email: "<data-contact email>"                    # main-text MUST

  # --- SUBJECT / CLINICAL ---------------------------------------------------
  subject:
    subject_id: "<de-identified subject id>"
    key_clinical_diagnosis: { label: "<diagnosis>", id: "<MONDO CURIE>" }   # field per NCIT:C15607
    sex_assigned_at_birth: "<male | female | ...>"           # per GSSO:009418
    pathological_state: "<affected | unaffected | ...>"      # per FairGenomes PathologicalState

  # --- SAMPLE ---------------------------------------------------------------
  sample:
    sample_id: "<id>"
    biosample: "<BioSample accession | ->"
    specimen_type: { label: "<tissue>", id: "<UBERON CURIE>" }        # blood UBERON:0000178 | saliva UBERON:0001836
    biospecimen_type: "<whole blood | saliva | ...>"          # per NCIT:C70713
    analyte: { label: "genomic DNA", id: "EFO:0008479" }      # EFO:0008479 includes organellar DNA (OBI:0001051 excludes it)
    collection_method: { label: "<method>", id: "<CURIE>" }   # blood OBI:1110095 | saliva NCIT:C200883
    sampling_protocol: "<protocol id / URI>"                  # per EFO:0005518
    collection_date: "<ISO-8601 date | ->"                    # MUST (main text)
    collection_location: "<generalized location | ->"         # MUST (main text)
    storage_conditions: "<e.g. -80C | ->"                     # MUST (main text)
    collection_site: "<generalized site id>"

  # --- SEQUENCING -----------------------------------------------------------
  sequencing:
    platform: "<platform>"                                    # per FairGenomes SequencingPlatform
    instrument_model: "<SRA/ENA INSTRUMENT_MODEL term>"       # per FairGenomes SequencingInstrumentModels; e.g. "Illumina NovaSeq 6000"; NextSeq family and HiSeq X carry no vendor prefix
    sbs_chemistry_channels: <1 | 2 | 4>          # record explicitly; 1=iSeq, 2=NovaSeq/NextSeq, 4=HiSeq family
    library_source: "<GENOMIC | TRANSCRIPTOMIC | ...>"        # SRA CV
    library_strategy: "<WGS | WXS | Targeted-Capture>"        # SRA CV
    library_selection: "<RANDOM | PCR | Hybrid Selection>"    # SRA CV, see SRA.experiment.xsd typeLibrarySelection
    library_construction: "<PCR-free | PCR-plus | hybridization capture | ->"   # free text, NOT an SRA CV field
    library_preparation: "<library / capture kit>"           # per FairGenomes NGSKits
    unique_molecular_identifiers: <true | false>             # per EFO:0010199
    sequencing_method: "<WGS | WXS | Targeted | ...>"        # per FairGenomes SequencingMethods
    library_layout: "<PAIRED | SINGLE>"
    read_length_bp: <int>
    target_mean_coverage_x: <int>
    sequencing_date: "<ISO-8601 date | ->"                    # MUST (main text)
    sequencing_location: "<generalized location | ->"        # MUST (main text)

  # --- CAPTURE (exome/panel only; delete for WGS) ---------------------------
  capture:
    kit: "<capture kit + version>"
    target_regions_bed: "<path to target-regions BED (GRCh38)>"
    target_regions_checksum: "sha256:<digest>"
    target_size_mb: <f>

  # --- PANEL (targeted panel only; delete otherwise) ------------------------
  panel:
    name: "<panel name>"
    version: "<vX.Y>"
    gene_count: <int>
    genes_example: [ { symbol: "<SYMBOL>", hgnc: "<HGNC CURIE>" } ]
    target_regions_bed: "<path to panel BED (GRCh38)>"
    target_regions_checksum: "sha256:<digest>"

  # --- REFERENCE (Refget Sequence Collections) ------------------------------
  reference_assembly:
    label: "<assembly label with exact sequence order, e.g. GRCh38 ... chr1-chr22, chrM, chrX, chrY>"
    seqcol_digest: "<GA4GH seqcol top-level digest, e.g. Ba88PY52_qeifhJrgUXyin6UITdXNsg3>"   # bare, no SQ. prefix; order-sensitive
    source_uri: "<URI of the exact reference FASTA used>"     # Table 3 MUST: pointer to source file (per FairGenomes GenomeAccessions)
    source_checksum: "md5:<fasta-md5>"

  # --- PROCESSING / WORKFLOW ------------------------------------------------
  processing:
    alignment:       { tool: "<tool>", tool_id: "<biotools:slug | EDAM>", version: "<x.y.z>", container: "sha256:<digest>", parameters: "<args>" }
    variant_calling: { tool: "<tool>", tool_id: "<biotools:slug | EDAM>", version: "<x.y.z>", container: "sha256:<digest>", parameters: "<args>" }
    analyses_performed: "<e.g. germline SNV/indel calling>"   # per FairGenomes AnalysesPerformed
    read_mapping_quality: "<e.g. MAPQ>=20 retained>"          # MUST (main text)
    deviations: "<protocol deviations | none>"               # MUST (main text)
    random_seed: "<pipeline RNG seed>"                        # MUST (reproducibility)
    processing_date: "<ISO-8601 date | ->"                    # MUST (main text)
    processing_location: "<generalized location | ->"        # MUST (main text)
    workflow:        { engine: "<engine>", version: "<x.y.z>", run_id: "<uuid>",
                       commit_sha: "<git sha>", provenance: "<path to W3C PROV record>" }

  # --- SEQUENCE DATA (register raw/aligned reads; Suppl Table 2 MUST formats) -
  sequence_data:
    fastq: [ { file: "<R1.fastq.gz>", checksum: "sha256:<digest>" }, { file: "<R2.fastq.gz>", checksum: "sha256:<digest>" } ]   # FASTQ MUST
    cram:  { file: "<sample.cram>", checksum: "sha256:<digest>", reference_seqcol: "<seqcol digest>" }   # CRAM/BAM MUST; CRAM pins its reference
    reference_fasta: { file: "<GRCh38.fa>", checksum: "md5:<digest>" }   # FASTA MUST
    feature_annotation: { file: "<annotation.gff3.gz>", format: "GFF3", checksum: "sha256:<digest>" }   # GFF MUST

  # --- VARIANT (call-set level) ---------------------------------------------
  variant_callset:
    file: "<sample.g.vcf.gz>"                    # gVCF (Suppl Table 2 MUST; min version 4.2)
    vcf_version: "<4.2 | 4.3>"
    checksum: "sha256:<digest>"
    normalization: "fully-justified (GA4GH VRS)"   # VRS uses fully-justified normalization, NOT left-alignment
    variant_count: <int>
    snv_count: <int>
    indel_count: <int>                           # snv_count + indel_count should equal variant_count
    inferred_sex_karyotype: "<XX | XY | ...>"    # genotypic sex from the callset (per FairGenomes GenotypicSex)
    variant_representation:                       # GA4GH VRS - Table 6 MUST (one worked allele, computed with vrs-python)
      - vrs_id: "<ga4gh:VA.* computed against the seqcol-pinned reference>"
        hgvs_g: "<GRCh38 g. HGVS expression>"
        variant_quality: <QUAL>
        total_depth: <DP>
        ref_supporting_reads: <AD[0]>
        alt_supporting_reads: <AD[1]>
    reference_stamps: { gnomad: "<release>", clinvar: "<snapshot date>", dbnsfp: "<release>" }

  # --- GENETIC ANCESTRY (omit for small panels; say so if omitted) ----------
  genetic_ancestry:
    method: "<e.g. PCA projection onto 1000 Genomes>"   # ancestry field per NCIT:C176763
    superpop_fractions: { AFR: <f>, AMR: <f>, EAS: <f>, EUR: <f>, SAS: <f> }
    top_pcs: [ <pc1>, <pc2>, <pc3> ]

  # --- QC -------------------------------------------------------------------
  qc:
    mean_coverage_x: <f>                          # (exome/panel: mean_target_coverage_x)
    callable_fraction_ge10x_nonN: <f>             # denominator is non-N reference bases
    contamination_freemix: <f>                    # VerifyBamID2 - within-species (human-human) contamination
    human_read_fraction: <f>                      # lower for saliva (non-host DNA); the specimen-source signal
    duplicate_rate: <f>
    ti_tv: <f>                                     # omit for small panels (too few sites)
    sex_concordance: "<concordant | discordant>"  # phenotype.reported_sex vs variant_callset.inferred_sex_karyotype

  # --- PHENOTYPE (align to GA4GH Phenopacket v2) ----------------------------
  phenotype:
    phenopacket: "<path to GA4GH Phenopacket v2 for this subject>"
    phenotypes_ref: "NCIT:C16977"                 # phenotypes field per Supp Table 1
    diseases:
      - term: { label: "<disease>", id: "<MONDO CURIE>" }
    reported_sex: { label: "<Male | Female>", id: "<NCIT:C20197 | NCIT:C16576>" }   # self-reported/clinical sex
    measure_count: <int>
    example_measurements:
      - assay: { label: "<assay>", id: "<LOINC CURIE>" }
        value: { quantity: { value: <N>, unit: { label: "Score", id: "NCIT:C25338" } } }

  # --- PROVENANCE (dataset-level; W3C PROV) ---------------------------------
  provenance:
    generated_by: { orcid: "<ORCID URL>", role: "<role>" }
    generated_at: "<ISO-8601 UTC>"
    reference_manifest_digest: "sha256:<digest>"
    pipeline_commit_sha: "<git sha>"
    prov_record: "<path to W3C PROV record>"

  # --- ANALYSIS COVARIATES (flattened, model-ready subset) ------------------
  analysis_covariates:
    site: "<site>"
    specimen_type: "<blood | saliva | ...>"
    sbs_chemistry_channels: <1 | 2 | 4>
    aligner: "<tool>"
    variant_caller: "<tool>"
    mean_coverage_x: <f>
    contamination_freemix: <f>
    human_read_fraction: <f>
    ancestry_pc: [ <pc1>, <pc2>, <pc3> ]

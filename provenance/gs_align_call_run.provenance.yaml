# =============================================================================
# Workflow-run provenance record - GS alignment + variant calling
# Bridge2AI Genomic Information Standards (GIST)
#
# Structured after the W3C PROV activity/entity model: each activity records the
# entities it `used` and `generated` (cf. prov:used, prov:generated). This is a
# plain YAML/JSON record, not a serialized PROV-O graph and not an RO-Crate.
# Entities carry identity and checksum as separate fields (not fused with '#', so
# ids stay valid IRIs). The reference set is identified by a GA4GH Refget Sequence
# Collections digest (../identifiers/refget-seqcol.md).
#
# This is the illustrative run for sample B1-0001; its final `generated` entity is
# that sample's gVCF, so the PROV chain closes onto the example package in
# ../examples/genome_sequencing/autism_gs_composite.metadata.yaml. Each real
# sample carries its own record of the same shape - which is what makes B1's
# (BWA-MEM/GATK) and B2's (DRAGMAP/DRAGEN) heterogeneous pipelines comparable.
# =============================================================================

_disclaimer: >-
  ILLUSTRATIVE / SYNTHETIC. Example provenance for the Bridge2AI GIST
  implementation resources (arXiv:2512.11519). No values derive from human
  subjects. run_id, checksums, container digests, and timestamps are placeholders.
  The GRCh38 GA4GH Refget seqcol digest is real (resolvable).

workflow_run:
  run_id: "<uuid>"
  ended: "2026-01-15T04:22:10Z"
  workflow:
    name: "gs-align-call"
    version: "2.3.1"
    commit: "<git sha>"                          # pinned pipeline revision
    engine: "nextflow 24.04.0"
    random_seed: "<pipeline RNG seed>"           # recorded for reproducibility
  agent:
    center: "B1"                                 # generalized center id
    operator_orcid: "https://orcid.org/0000-0000-0000-0000"   # deliberately checksum-invalid: never a real iD

  reference_set:
    label: "GRCh38 primary assembly, UCSC naming, 25 sequences in seqcol order: chr1-chr22, chrM, chrX, chrY"
    seqcol_digest: "Ba88PY52_qeifhJrgUXyin6UITdXNsg3"   # real GA4GH seqcol digest; verified before run
    manifest_digest: "sha256:<lock-digest>"      # full reference-bundle hash lock

  # Each activity's `generated` entity is the next activity's `used` entity, so the
  # chain is closed: fastq -> cram -> gVCF (the package's variant_callset).
  steps:
    - id: align
      activity: "sequence alignment"
      tool: { name: "bwa-mem", tool_id: "biotools:bwa", version: "0.7.17", container: "sha256:<digest>" }
      used:      [ { id: "B1-0001_R1.fastq.gz", checksum: "sha256:<digest>" }, { id: "B1-0001_R2.fastq.gz", checksum: "sha256:<digest>" } ]
      generated: [ { id: "B1-0001.cram", checksum: "sha256:<digest>", reference_seqcol: "Ba88PY52_qeifhJrgUXyin6UITdXNsg3" } ]
      parameters: "-M -K 100000000"
    - id: call
      activity: "germline variant calling"
      tool: { name: "gatk-haplotypecaller", tool_id: "biotools:gatk", version: "4.4.0.0", container: "sha256:<digest>" }
      used:      [ { id: "B1-0001.cram", checksum: "sha256:<digest>" } ]
      generated: [ { id: "B1-0001.g.vcf.gz", checksum: "sha256:<digest>", vcf_version: "4.3" } ]   # == the package's variant_callset.file
      parameters: "--ploidy 2 -ERC GVCF"

  qc_gate:
    contamination_freemix: { value: 0.005, max: 0.02 }   # VerifyBamID2 (human-human); all arms (freemix <= 0.006) sit comfortably inside this bound
    sex_concordance: "concordant"
    verdict: "pass"

# The B2 runs are the same PROV STRUCTURE with different VALUES (dragmap / dragen,
# their own inputs and checksums) - an identical provenance schema across different
# pipelines is exactly what lets a consumer compare center runs programmatically.
